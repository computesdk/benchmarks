name: AI Gateway Model Index

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/ai-gateway/**'
      - 'benchmarks/src/util/**'
      - 'benchmarks/scripts/provider-vars.json'
      - 'package.json'
      - '.github/workflows/ai-gateway-model-index.yml'
  schedule:
    - cron: '0 9 * * 5' # Weekly on Friday at 9am UTC (4am CDT)
  workflow_dispatch:
    inputs:
      provider:
        description: 'Gateway to run (leave empty for full roster)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - openrouter
          - vercel-ai-gateway
          - cloudflare-ai-gateway
          - blazerail
          - llmgateway
          - pydantic-ai-gateway
          - concentrate-ai-gateway
          - ramp
          - neon
          - ngrok
          - llmapi
          - novita
          - github-copilot
      dry_run:
        description: 'Run without ingesting or committing results'
        required: false
        default: false
        type: boolean
      trigger_source:
        description: 'Recorded on platform runs as their trigger (e.g. platform-retrigger); leave empty for a plain manual run'
        required: false
        default: ''
      trigger_requested_by:
        description: 'Who asked for this run (e.g. the platform org slug); recorded alongside trigger_source'
        required: false
        default: ''
      trigger_request_id:
        description: 'Platform re-trigger request id; recorded so the platform can link this run back to the request'
        required: false
        default: ''

concurrency:
  group: ai-gateway-model-index
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  BENCH_TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || '' }}
  BENCH_TRIGGER_REQUESTED_BY: ${{ github.event.inputs.trigger_requested_by || '' }}
  BENCH_TRIGGER_REQUEST_ID: ${{ github.event.inputs.trigger_request_id || '' }}

jobs:
  model-index:
    name: AI Gateway Model Index
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: namespacelabs/nscloud-setup@v0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' run build
      - name: Run AI gateway model index
        env:
          PROVIDER: ${{ github.event.inputs.provider }}
        run: |
          . benchmarks/scripts/load-vault-secrets.sh "^($(jq -r '.["ai-gateway-model-index"] | to_entries[] | .value[]?' benchmarks/scripts/provider-vars.json | sort -u | paste -sd'|')|BENCHMARKS_PLATFORM_API_KEY)"

          # GitHub Copilot is kept in the daily runs but excluded from the weekly run.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            unset GITHUB_COPILOT_API_KEY GITHUB_COPILOT_OAUTH_TOKEN
          fi

          provider_args=()
          if [ -n "$PROVIDER" ]; then
            provider_args=(--provider "$PROVIDER")
          fi

          npx tsx packages/benchsdk-runner/dist/bin.js run benchmarks/ai-gateway/ai-gateway-model-index.bench.ts "${provider_args[@]}" \
            ${{ (github.event_name == 'push' || github.event.inputs.dry_run == 'true') && '--no-ingest' || '' }}
      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-gateway-model-index-results
          path: results/ai-gateway-model-index/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit and push
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ai-gateway-model-index/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update ai gateway model index [skip ci]"

          branch="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${branch}"
            git rebase --autostash "origin/${branch}" || { git rebase --abort; exit 1; }
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); will rebase and retry"
          done
          echo "Failed to push after multiple attempts" >&2
          exit 1
