name: Sandbox Dax Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/sandbox/dax.ts'
      - 'benchmarks/sandbox/providers.ts'
      - 'benchmarks/src/merge-results.ts'
      - 'benchmarks/scripts/dax-benchmark.sh'
      - 'package.json'
      - '.github/workflows/sandbox-dax-benchmarks.yml'
  schedule:
    - cron: '0 0 * * 5' # Weekly on Friday at midnight UTC
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per provider'
        required: false
        default: '1'
      provider:
        description: 'Provider to run (leave empty for all)'
        required: false
        default: ''
      dry_run:
        description: 'Run without ingesting or committing results'
        required: false
        default: false
        type: boolean

concurrency:
  group: dax-benchmarks
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  dax:
    name: Dax ${{ matrix.provider }}
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider:
          - archil
          - arker
          - beam
          - blaxel
          - cloud-run
          - cloudflare
          - codesandbox
          - createos
          - daytona
          - declaw
          - e2b
          - hopx
          - isorun
          - lightning
          - modal
          - namespace
          - northflank
          - opencomputer
          - runloop
          - sandbox0
          - superserve
          - tenki
          - tensorlake
          - upstash
          - vercel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm update
          else
            pnpm install --frozen-lockfile
          fi
      - name: Build E2B template with 8 vCPU / 16 GiB
        if: matrix.provider == 'e2b'
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(E2B_API_KEY)'
          npx tsx benchmarks/scripts/build-e2b-template.ts
      - name: Build Superserve template with 8 vCPU / 16 GiB
        if: matrix.provider == 'superserve'
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(SUPERSERVE_API_KEY)'
          npx tsx benchmarks/scripts/build-superserve-template.ts
      - name: Find Northflank plan for 8 vCPU / 16 GiB
        if: matrix.provider == 'northflank'
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(NORTHFLANK_TOKEN|NORTHFLANK_PROJECT_ID)'
          npx tsx benchmarks/scripts/find-northflank-plan.ts
      - name: Clear stale results from checkout
        run: rm -rf results/
      - name: Run dax benchmark
        env:
          LIGHTNING_INSTANCE_TYPE: cpu-8 # 8 vCPU / 16 GiB, matching the standardized dax profile
          ARKER_PLATFORMS: graviton4 # dax only; elsewhere Arker picks the platform automatically
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(ARCHIL_API_KEY|ARCHIL_REGION|ARCHIL_DISK_ID|ARKER_API_KEY|BEAM_TOKEN|BEAM_WORKSPACE_ID|BL_API_KEY|BL_WORKSPACE|CLOUD_RUN_SANDBOX_URL|CLOUD_RUN_SANDBOX_SECRET|CLOUDFLARE_SANDBOX_URL|CLOUDFLARE_SANDBOX_SECRET|CSB_API_KEY|CREATEOS_SANDBOX_API_KEY|DAYTONA_API_KEY|DECLAW_API_KEY|E2B_API_KEY|HOPX_API_KEY|ISORUN_API_KEY|LIGHTNING_API_KEY|MODAL_TOKEN_ID|MODAL_TOKEN_SECRET|NSC_TOKEN|NORTHFLANK_TOKEN|NORTHFLANK_PROJECT_ID|OPENCOMPUTER_API_KEY|OPENCOMPUTER_API_URL|RUNLOOP_API_KEY|SANDBOX0_TOKEN|SPRITES_TOKEN|SUPERSERVE_API_KEY|TENKI_API_KEY|TENSORLAKE_API_KEY|UPSTASH_BOX_API_KEY|VERCEL_TOKEN|VERCEL_TEAM_ID|VERCEL_PROJECT_ID|COMPUTESDK_ADMIN_API_KEY|BENCHMARKS_PLATFORM_API_KEY)'

          npx tsx packages/benchsdk-runner/dist/bin.js run benchmarks/sandbox/dax.bench.ts \
            --provider ${{ matrix.provider }} \
            --iterations ${{ github.event.inputs.iterations || '1' }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.provider }}-sandbox-dax
          path: results/
          if-no-files-found: ignore
          retention-days: 7

  collect:
    name: Collect Dax Results
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe
    needs: dax
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm update
          else
            pnpm install --frozen-lockfile
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: results-*
      - name: Merge results
        run: npx tsx benchmarks/src/merge-results.ts --input artifacts
      - name: Ingest results to platform
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(INGEST_URL|INGEST_SECRET)'
          npx tsx benchmarks/src/ingest.ts --type sandbox
      - name: Post results to merged PR
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const latestPath = path.join('results', 'sandbox-dax', 'latest.json');
            let body = '## Sandbox Dax Benchmark Results\n\n';
            let hasResults = false;

            if (fs.existsSync(latestPath)) {
              const data = JSON.parse(fs.readFileSync(latestPath, 'utf-8'));
              const results = data.results.filter(r => !r.skipped);
              if (results.length > 0) {
                hasResults = true;
                body += '| Provider | Phases | Total | Prepare | Clone | Install | Typecheck | Status |\n';
                body += '|----------|--------|-------|---------|-------|---------|-----------|--------|\n';
                for (const r of results) {
                  const latest = [...r.iterations].reverse().find(i => i.phasesCompleted != null);
                  const score = latest ? `${latest.phasesCompleted}/${latest.phasesTotal}` : '--';
                  const ok = r.iterations.filter(it => !it.error).length;
                  const total = r.iterations.length;
                  const total_s = (r.summary.totalMs.median / 1000).toFixed(2) + 's';
                  const prepare_s = (r.summary.prepareMs.median / 1000).toFixed(2) + 's';
                  const clone_s = (r.summary.cloneMs.median / 1000).toFixed(2) + 's';
                  const install_s = (r.summary.installMs.median / 1000).toFixed(2) + 's';
                  const typecheck_s = (r.summary.typecheckMs.median / 1000).toFixed(2) + 's';
                  body += `| ${r.provider} | ${score} | ${total_s} | ${prepare_s} | ${clone_s} | ${install_s} | ${typecheck_s} | ${ok}/${total} OK |\n`;
                }
              }
            }

            if (!hasResults) {
              body += '> No dax benchmark results were generated.\n\n';
            }

            body += `---\n*[View full run](${runUrl})*`;

            // This push is a merge to master — post results to the PR it closed.
            // A commit can be associated with several PRs (backports, merge
            // queue), so pick the one merged into the branch we pushed to.
            const target = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pr = prs.find(p => p.merged_at && p.base.ref === target);
            if (!pr) {
              // Direct push with no associated PR — fall back to a commit comment.
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body,
              });
              return;
            }

            const marker = '## Sandbox Dax Benchmark Results';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
      - name: Commit and push
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/sandbox-dax/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update dax benchmark results [skip ci]"

          branch="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${branch}"
            git rebase --autostash "origin/${branch}" || { git rebase --abort; exit 1; }
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); will rebase and retry"
          done
          echo "Failed to push after multiple attempts" >&2
          exit 1
