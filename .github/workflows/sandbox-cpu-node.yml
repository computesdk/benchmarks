name: Sandbox Cpu-node Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/sandbox/cpu-node.ts'
      - 'benchmarks/sandbox/cpu-node.bench.ts'
      - 'benchmarks/sandbox/cpu-node-legacy-results.ts'
      - 'benchmarks/sandbox/generate-cpu-node-svg.ts'
      - 'benchmarks/scripts/cpu-node-workload.js'
      - 'benchmarks/scripts/cpu-node-stdout.js'
      - 'benchmarks/scripts/smoke.ts'
      - 'benchmarks/scripts/load-vault-secrets.sh'
      - 'package.json'
      - '.github/workflows/sandbox-cpu-node.yml'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per provider'
        required: false
        default: '3'
      provider:
        description: 'Comma-separated provider filter. Leave empty for all 24 providers.'
        required: false
        default: ''
      dry_run:
        description: 'Run without ingesting or committing results'
        required: false
        default: false
        type: boolean

concurrency:
  group: cpu-node-benchmark
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  bench:
    name: ${{ matrix.provider }}
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe
    # runs-on: self-hosted
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider:
          - archil
          - beam
          - blaxel
          - cloud-run
          - cloudflare
          - codesandbox
          - createos
          - daytona
          - declaw
          - e2b
          - hopx
          - isorun
          - lightning
          - modal
          - microsandbox
          - miosa
          - mosaic
          - northflank
          - opencomputer
          - run-cloud
          - runloop
          - sail
          - sandbox0
          - superserve
          - tenki
          - tensorlake
          - upstash
          - vercel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: namespacelabs/nscloud-setup@v0
      - name: Install dependencies
        if: |
          github.event_name != 'workflow_dispatch' ||
          (github.event.inputs.provider == '' || contains(format(',{0},', github.event.inputs.provider), format(',{0},', matrix.provider)))
        run: |
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            pnpm update
          else
            pnpm install --frozen-lockfile
          fi
      - name: Clear stale results
        if: |
          github.event_name != 'workflow_dispatch' ||
          (github.event.inputs.provider == '' || contains(format(',{0},', github.event.inputs.provider), format(',{0},', matrix.provider)))
        run: rm -rf results/
      - name: Run cpu-node benchmark
        if: |
          github.event_name != 'workflow_dispatch' ||
          (github.event.inputs.provider == '' || contains(format(',{0},', github.event.inputs.provider), format(',{0},', matrix.provider)))
        env:
          PROVIDER: ${{ matrix.provider }}
          ITERATIONS: ${{ github.event.inputs.iterations || '3' }}
        run: |
          COMMON_KEYS='BENCHMARKS_PLATFORM_API_KEY'
          case "$PROVIDER" in
            archil) PROVIDER_KEYS='ARCHIL_API_KEY|ARCHIL_REGION|ARCHIL_DISK_ID' ;;
            arker) PROVIDER_KEYS='ARKER_API_KEY' ;;
            beam) PROVIDER_KEYS='BEAM_TOKEN|BEAM_WORKSPACE_ID' ;;
            blaxel) PROVIDER_KEYS='BL_API_KEY|BL_WORKSPACE' ;;
            cloud-run) PROVIDER_KEYS='CLOUD_RUN_SANDBOX_URL|CLOUD_RUN_SANDBOX_SECRET' ;;
            cloudflare) PROVIDER_KEYS='CLOUDFLARE_SANDBOX_URL|CLOUDFLARE_SANDBOX_SECRET' ;;
            codesandbox) PROVIDER_KEYS='CSB_API_KEY' ;;
            createos) PROVIDER_KEYS='CREATEOS_SANDBOX_API_KEY' ;;
            daytona) PROVIDER_KEYS='DAYTONA_API_KEY' ;;
            declaw) PROVIDER_KEYS='DECLAW_API_KEY' ;;
            e2b) PROVIDER_KEYS='E2B_API_KEY' ;;
            hopx) PROVIDER_KEYS='HOPX_API_KEY' ;;
            isorun) PROVIDER_KEYS='ISORUN_API_KEY' ;;
            lightning) PROVIDER_KEYS='LIGHTNING_API_KEY' ;;
            modal) PROVIDER_KEYS='MODAL_TOKEN_ID|MODAL_TOKEN_SECRET' ;;
            microsandbox) PROVIDER_KEYS='MSB_API_KEY' ;;
            miosa) PROVIDER_KEYS='MIOSA_API_KEY' ;;
            mosaic) PROVIDER_KEYS='MOSAIC_API_URL|MOSAIC_API_TOKEN' ;;
            namespace) PROVIDER_KEYS='NSC_TOKEN' ;;
            northflank) PROVIDER_KEYS='NORTHFLANK_TOKEN|NORTHFLANK_PROJECT_ID' ;;
            opencomputer) PROVIDER_KEYS='OPENCOMPUTER_API_KEY|OPENCOMPUTER_API_URL' ;;
            run-cloud) PROVIDER_KEYS='RUN_CLOUD_API_KEY' ;;
            runloop) PROVIDER_KEYS='RUNLOOP_API_KEY' ;;
            sail) PROVIDER_KEYS='SAIL_API_KEY' ;;
            sandbox0) PROVIDER_KEYS='SANDBOX0_TOKEN' ;;
            sprites) PROVIDER_KEYS='SPRITES_TOKEN' ;;
            superserve) PROVIDER_KEYS='SUPERSERVE_API_KEY' ;;
            tenki) PROVIDER_KEYS='TENKI_API_KEY' ;;
            tensorlake) PROVIDER_KEYS='TENSORLAKE_API_KEY' ;;
            upstash) PROVIDER_KEYS='UPSTASH_BOX_API_KEY' ;;
            vercel) PROVIDER_KEYS='VERCEL_TOKEN|VERCEL_TEAM_ID|VERCEL_PROJECT_ID' ;;
            *) PROVIDER_KEYS='' ;;
          esac
          if [ -n "$PROVIDER_KEYS" ]; then
            KEYS="^(${COMMON_KEYS}|${PROVIDER_KEYS})="
          else
            KEYS="^(${COMMON_KEYS})="
          fi
          . benchmarks/scripts/load-vault-secrets.sh "$KEYS"

          # All matrix jobs for this workflow run share a single platform run. The
          # attempt number is included so re-runs do not rejoin completed runs.
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pnpm exec -- tsx packages/benchsdk-runner/dist/bin.js run benchmarks/sandbox/cpu-node.bench.ts \
            --provider "$PROVIDER" \
            --iterations "$ITERATIONS" \
            --run-key "$RUN_KEY" \
            ${{ (github.event_name == 'push' || github.event.inputs.dry_run == 'true') && '--no-ingest' || '' }}
      - name: Upload results
        if: |
          always() && (
            github.event_name != 'workflow_dispatch' ||
            (github.event.inputs.provider == '' || contains(format(',{0},', github.event.inputs.provider), format(',{0},', matrix.provider)))
          )
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.provider }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

  collect:
    name: Collect Results
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe
    # runs-on: self-hosted
    needs: bench
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: namespacelabs/nscloud-setup@v0
      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            pnpm update
          else
            pnpm install --frozen-lockfile
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: results-*
      - name: Merge per-provider results
        run: npx tsx benchmarks/src/merge-results.ts --input artifacts --mode benchmark
      - name: Generate SVG chart
        run: pnpm run generate-cpu-node-svg
      - name: Upload SVG as artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: cpu-node-benchmark-svg
          path: 'cpu_node.svg'
          if-no-files-found: ignore
          retention-days: 7
      - name: Ingest results to platform
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(BENCHMARKS_PLATFORM_API_KEY|BENCHMARKS_PLATFORM_URL)='
          npx tsx benchmarks/src/ingest.ts --type cpu-node
      - name: Commit and push
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ cpu_node.svg
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update cpu-node benchmark results [skip ci]"

          branch="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${branch}"
            git rebase --autostash "origin/${branch}" || { git rebase --abort; exit 1; }
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); will rebase and retry"
          done
          echo "Failed to push after multiple attempts" >&2
