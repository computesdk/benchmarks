name: Browser Throughput Benchmark

# computesdk:secrets=NSC_TOKEN
# computesdk:secrets-env=declared

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/browser/**'
  schedule:
    - cron: '30 10 * * 5' # Weekly on Friday at 10:30am UTC (5:30am CDT, offset from main browser benchmark to avoid provider contention)
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optional platform benchmark slug override'
        required: false
        default: ''
      name:
        description: 'Optional platform benchmark name override'
        required: false
        default: ''
      iterations:
        description: 'Iterations per provider (sessions)'
        required: false
        default: '100'
      dry_run:
        description: 'Run without ingesting results'
        required: false
        default: false
        type: boolean
      trigger_source:
        description: 'Recorded on platform runs as their trigger (e.g. platform-retrigger); leave empty for a plain manual run'
        required: false
        default: ''
      trigger_requested_by:
        description: 'Who asked for this run (e.g. the platform org slug); recorded alongside trigger_source'
        required: false
        default: ''
      trigger_request_id:
        description: 'Platform re-trigger request id; recorded so the platform can link this run back to the request'
        required: false
        default: ''

concurrency:
  group: browser-throughput-benchmarks
  cancel-in-progress: true

permissions:
  contents: read

  id-token: write

env:
  BENCHMARK_SLUG: ${{ github.event.inputs.slug || '' }}
  BENCH_TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || '' }}
  BENCH_TRIGGER_REQUESTED_BY: ${{ github.event.inputs.trigger_requested_by || '' }}
  BENCH_TRIGGER_REQUEST_ID: ${{ github.event.inputs.trigger_request_id || '' }}
  BENCHMARK_NAME: ${{ github.event.inputs.name || '' }}

jobs:
  setup:
    name: Resolve target pages
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe;permissions.additional_grant=vault/object:*:reveal
    # runs-on: self-hosted
    outputs:
      urls: ${{ steps.pick.outputs.urls }}
    steps:
      - name: Resolve one shared random article per iteration
        id: pick
        run: |
          # Resolve one concrete article per iteration up front so every
          # provider benchmarks against the same page in a given round — but a
          # different page each round, so we don't measure a warmed cache.
          count=${{ github.event_name == 'push' && '3' || github.event.inputs.iterations || '100' }}
          urls=()
          for i in $(seq 1 "$count"); do
            # Follow Special:Random's redirect once to a concrete article URL.
            # Retry up to 5 times until we find an article that has at least
            # one article-body link (href containing "/wiki/" without a colon,
            # which excludes namespace pages like Help:, File:, Special:).
            # Stub articles without body links cause the click action to time
            # out and skew throughput results.
            for attempt in 1 2 3 4 5; do
              url=$(curl -sL -A 'ComputeSDK-Benchmark' -o /dev/null -w '%{url_effective}' \
                'https://en.wikipedia.org/wiki/Special:Random')
              if [ -z "$url" ] || [[ "$url" == *"Special:Random"* ]]; then
                url='https://en.wikipedia.org/wiki/Special:Random'
                break
              fi
              # Fetch the article HTML and check for article-body links.
              # The benchmark selects #mw-content-text a[href*="/wiki/"] and
              # filters in JS for links without a namespace colon after /wiki/.
              # Body links appear as protocol-relative (//en.wikipedia.org/wiki/)
              # or absolute (https://en.wikipedia.org/wiki/) URLs.
              html=$(curl -sL -A 'ComputeSDK-Benchmark' "$url")
              if echo "$html" | grep -qP 'href="(//en\.wikipedia\.org)?/wiki/[^"]*" *' \
                 && echo "$html" | grep -oP 'href="[^"]*"' \
                    | grep -qP '/wiki/[^:]*$'; then
                break
              fi
            done
            urls+=("$url")
          done
          # Emit as a newline-delimited multiline output. Pure bash — avoids a
          # jq/python dependency that may be absent on the runner image.
          {
            echo "urls<<URLS_EOF"
            printf '%s\n' "${urls[@]}"
            echo "URLS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ${#urls[@]} shared article URLs for all providers"

  bench:
    name: Bench ${{ matrix.provider }}
    # Run Browser Use in Ohio and Browserbase in Oregon, near their services.
    runs-on: ${{ matrix.provider == 'browseruse' && 'computesdk:computesdk:aws-us-east-2' || matrix.provider == 'browserbase' && 'computesdk:computesdk:aws-us-west-2' || 'namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe;permissions.additional_grant=vault/object:*:reveal' }}
    # runs-on: self-hosted
    needs: setup
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider:
          - browserbase
          - browseruse
          - hyperbrowser
          - kernel
          - notte
          - steel
          - styne
          - tilion
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      # ComputeSDK runners get no GitHub OIDC token, so nscloud-setup's
      # `nsc auth exchange-github-token` cannot work there. Pre-seed the
      # workload token file it checks for when NSC_TOKEN is available;
      # accepts either the raw bearer token or a full token JSON document.
      # It also exports NSC_DOCKER_LOGIN/NSC_CONTAINER_REGISTRY so
      # nscloud-setup skips `nsc docker login`, which this token is not
      # granted for — the benchmarks only need vault access.
      - name: Seed Namespace token file
        run: |
          if [ -n "${NSC_TOKEN:-}" ] && [ ! -f /var/run/nsc/token.json ]; then
            mkdir -p /var/run/nsc
            case "$NSC_TOKEN" in
              \{*) printf '%s\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
              *) printf '{"bearer_token":"%s"}\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
            esac
            chmod 600 /var/run/nsc/token.json
            # The seeded token has no container-registry grant; tell
            # nscloud-setup to skip `nsc docker login` for later steps.
            echo "NSC_DOCKER_LOGIN=1" >> "$GITHUB_ENV"
            echo "NSC_CONTAINER_REGISTRY=nscr.io" >> "$GITHUB_ENV"
          fi
      - uses: namespacelabs/nscloud-setup@v0
      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm -r update --ignore-scripts
          else
            pnpm install --frozen-lockfile --ignore-scripts
          fi
      - name: Build workspace packages
        # The @benchsdk/* packages are built from source and dist/ is not
        # committed. Build them in topological order so dependents like
        # @benchsdk/client can resolve @benchsdk/worker during their own build.
        run: pnpm -r --filter './packages/**' run build
      - name: Run browser throughput benchmark
        env:
          THROUGHPUT_URLS: ${{ needs.setup.outputs.urls }}
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(BROWSERBASE_API_KEY|BROWSERBASE_PROJECT_ID|BROWSER_USE_API_KEY|HYPERBROWSER_API_KEY|KERNEL_API_KEY|NOTTE_API_KEY|STEEL_API_KEY|TILION_API_KEY|TILION_BASE_URL|BENCHMARKS_PLATFORM_API_KEY)'

          # styne's credential is loaded only in its own leg, not through the
          # shared allowlist above.
          if [ "${{ matrix.provider }}" = "styne" ]; then
            . benchmarks/scripts/load-vault-secrets.sh '^(STYNE_API_KEY)'
          fi

          # All matrix jobs for this workflow run share a single platform run. The
          # attempt number is included so re-runs do not rejoin completed runs.
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx tsx packages/benchsdk-runner/dist/bin.js run benchmarks/browser/browser-throughput.bench.ts \
            --provider ${{ matrix.provider }} \
            --iterations ${{ github.event_name == 'push' && '3' || github.event.inputs.iterations || '100' }} \
            --run-key "$RUN_KEY" \
            ${{ (github.event_name == 'push' || github.event.inputs.dry_run == 'true') && '--no-ingest' || '' }}
