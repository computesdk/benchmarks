name: Dependency bump

# Daily: bumps runtime dependencies to their latest npm releases.
# Caret-compatible bumps open a PR that auto-merges once required checks pass;
# breaking bumps (new major, or new minor on 0.x) open a draft PR for review.
# Runs at 18:00 UTC, after computesdk's 13:00 UTC provider SDK bump, so new
# @computesdk/* adapter releases are picked up the same day.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump ${{ matrix.scope }} npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: compatible
            branch: chore/npm-deps-bump
            title: 'chore(deps): bump benchmark packages to latest compatible npm releases'
            draft: false
            auto_merge: true
          - scope: breaking
            branch: chore/npm-deps-breaking-bump
            title: 'chore(deps): bump benchmark packages to latest breaking npm releases'
            draft: true
            auto_merge: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # Maintainers push migration fixes to the open breaking PR; regenerating
      # the branch would erase them, so wait until it is merged or closed.
      - name: Check for an open breaking PR
        id: open
        if: matrix.scope == 'breaking'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: echo "count=$(gh pr list --head '${{ matrix.branch }}' --state open --json number --jq length)" >> "$GITHUB_OUTPUT"

      - name: Bump package.json specifiers
        if: steps.open.outputs.count == '' || steps.open.outputs.count == '0'
        env:
          BUMP_SCOPE: ${{ matrix.scope }}
          BUMP_REPORT: ${{ runner.temp }}/bump.md
        run: node benchmarks/scripts/bump-deps.mjs

      - name: Update lockfile
        if: steps.open.outputs.count == '' || steps.open.outputs.count == '0'
        # --no-frozen-lockfile: package.json was just edited; CI defaults to frozen.
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Open PR
        if: steps.open.outputs.count == '' || steps.open.outputs.count == '0'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT is required so the PR triggers CI (GITHUB_TOKEN-created PRs do not).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: ${{ matrix.branch }}
          title: ${{ matrix.title }}
          body-path: ${{ runner.temp }}/bump.md
          draft: ${{ matrix.draft }}
          commit-message: ${{ matrix.title }}

      - name: Enable auto-merge
        if: matrix.auto_merge && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
