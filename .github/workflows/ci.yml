name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build packages
        # The root typecheck consumes the built dist output, so build all
        # workspace packages in dependency order before running typecheck.
        run: pnpm -r --filter './packages/**' run build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test repository migration contracts
        run: pnpm test:migration

      - name: Test daily workflow defaults
        run: node --test benchmarks/scripts/daily/oss-workflow-defaults.test.mjs

      - name: Test Wikipedia browser setup
        run: node --import tsx --test benchmarks/browser/wikipedia.test.ts

      - name: Install Chromium for offline browser workload regressions
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Test Wikipedia article link selection
        run: node --import tsx --test benchmarks/browser/wikipedia-links.test.ts

      - name: Test
        run: pnpm --filter @benchsdk/client run test

      - name: Test @benchsdk/cli
        run: pnpm --filter @benchsdk/cli run test

      - name: Test @benchsdk/runner
        run: pnpm --filter @benchsdk/runner run test

      - name: Test create-bench
        run: pnpm --filter create-bench run test

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Validates GitHub validation and .computesdk execution workflows for syntax and expression
      # errors. The self-hosted runner label is declared in
      # .github/actionlint.yaml. The empty-string choice-input defaults
      # (used as "run all / none" sentinels) are accepted by GitHub Actions
      # but flagged by actionlint's stricter parser, so that one rule is
      # ignored here, as is the "runs too frequently" rule — .computesdk
      # schedules execute on ComputeSDK Actions, not GitHub's 5-minute-minimum
      # cron (stealth-sandbox-reliability fires every minute). Shellcheck
      # integration is disabled (-shellcheck=)
      # because the bench run: scripts rely on intentional word-splitting of
      # multi-flag variables (e.g. $SEQ_ARGS, $PARALLEL_ARGS, $PROVIDER_FLAG).
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 \
            -color -ignore "string should not be empty" -ignore "scheduled job runs too frequently" -shellcheck= \
            .github/workflows/*.yml .computesdk/workflows/*.yml
