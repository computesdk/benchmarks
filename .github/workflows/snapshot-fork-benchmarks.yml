name: Snapshot/Fork Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/storage/**'
      - 'benchmarks/src/util/**'
      - 'benchmarks/src/merge-results.ts'
      - 'package.json'
  schedule:
    - cron: '30 11 * * 5' # Weekly on Friday at 11:30am UTC (6:30am CDT, offset from storage to avoid racing pushes to master)
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per provider'
        required: false
        default: '100'
      dataset:
        description: 'Dataset to test'
        required: false
        default: 'small'
        type: choice
        options:
          - small
          - wide
          - deep
      dry_run:
        description: 'Run without ingesting or committing results'
        required: false
        default: false
        type: boolean

concurrency:
  group: snapshot-fork-benchmarks
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  snapshot-fork:
    name: Snapshot/Fork ${{ matrix.provider }}
    # One real snapshot+fork cycle per provider per iteration: each iteration
    # creates and tears down real buckets/objects, so iteration counts are kept
    # low (and on the smallest dataset) to bound cost and leak risk. PRs run a
    # single iteration; the weekly schedule runs 100 for trend data and commits
    # the combined results. Fork PRs without secrets skip gracefully
    # (missing-creds path) rather than failing.
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe
    # runs-on: self-hosted
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        provider:
          - aws-s3
          - cloudflare-r2
          - tigris
          - azure-blob
          - tensorlake
          - archil
          - neon
          - mosaic
          # vercel-blob is disabled pending an adapter fix: its manifest-based
          # snapshot/fork emulation is unreliable on Vercel Blob's eventually-
          # consistent overwrites (stale reads + lost deletes). See providers.ts.
          # - vercel-blob
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: namespacelabs/nscloud-setup@v0
      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm -r update --ignore-scripts
          else
            pnpm install --frozen-lockfile --ignore-scripts
          fi
          pnpm -r --filter './packages/**' run build
      - name: Clear stale results from checkout
        run: rm -rf results/snapshot-fork/
      - name: Run snapshot/fork test
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_REGION|S3_BUCKET|S3_SNAPSHOT_ACCESS_KEY_ID|S3_SNAPSHOT_SECRET_ACCESS_KEY|S3_SNAPSHOT_BUCKET|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|R2_BUCKET|R2_ACCOUNT_ID|R2_SNAPSHOT_ACCESS_KEY_ID|R2_SNAPSHOT_SECRET_ACCESS_KEY|R2_SNAPSHOT_BUCKET|TIGRIS_STORAGE_ACCESS_KEY_ID|TIGRIS_STORAGE_SECRET_ACCESS_KEY|TIGRIS_STORAGE_BUCKET|TIGRIS_SNAPSHOT_ACCESS_KEY|TIGRIS_SNAPSHOT_SECRET_KEY|TIGRIS_SNAPSHOT_STORAGE_BUCKET|BLOB_READ_WRITE_TOKEN|VERCEL_BLOB_BUCKET|GCS_PROJECT_ID|GCS_BUCKET|GCS_CLIENT_EMAIL|GCS_PRIVATE_KEY|AZURE_ACCOUNT_NAME|AZURE_ACCOUNT_KEY|AZURE_CONTAINER|AZURE_SNAPSHOT_ACCOUNT_NAME|AZURE_SNAPSHOT_ACCOUNT_KEY|AZURE_SNAPSHOT_CONTAINER|TENSORLAKE_API_KEY|TENSORLAKE_API_URL|TENSORLAKE_ORGANIZATION_ID|TENSORLAKE_PROJECT_ID|TENSORLAKE_FILESYSTEM|ARCHIL_S3_ACCESS_KEY_ID|ARCHIL_S3_SECRET_ACCESS_KEY|ARCHIL_BUCKET|ARCHIL_REGION|ARCHIL_BRANCH|NEON_BUCKET|NEON_ENDPOINT|NEON_ACCESS_KEY_ID|NEON_SECRET_ACCESS_KEY|NEON_REGION|NEON_SNAPSHOT_BUCKET|NEON_SNAPSHOT_ENDPOINT|NEON_SNAPSHOT_ACCESS_KEY_ID|NEON_SNAPSHOT_SECRET_ACCESS_KEY|NEON_SNAPSHOT_REGION|MOSAIC_BUCKET|MOSAIC_ACCESS_KEY_ID|MOSAIC_SECRET_ACCESS_KEY|MOSAIC_REGION|MOSAIC_ENDPOINT|MOSAIC_SNAPSHOT_BUCKET|MOSAIC_SNAPSHOT_ACCESS_KEY_ID|MOSAIC_SNAPSHOT_SECRET_ACCESS_KEY|MOSAIC_SNAPSHOT_REGION|MOSAIC_SNAPSHOT_ENDPOINT|BENCHMARKS_PLATFORM_API_KEY)'

          # All matrix jobs for this workflow run share a single platform run. The
          # attempt number is included so re-runs do not rejoin completed runs.
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Cap the benchmark process at 60 minutes so the job can still upload
          # partial results and complete instead of being cancelled by GitHub.
          timeout 60m npx tsx packages/benchsdk-runner/dist/bin.js run benchmarks/storage/snapshot-fork.bench.ts \
            --provider ${{ matrix.provider }} \
            --dataset ${{ github.event.inputs.dataset || 'small' }} \
            --iterations ${{ (github.event_name == 'schedule' && '100') || github.event.inputs.iterations || (github.event_name == 'push' && '1') || '3' }} \
            --run-key "$RUN_KEY" \
            ${{ (github.event_name == 'push' || github.event.inputs.dry_run == 'true') && '--no-ingest' || '' }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-fork-results-${{ matrix.provider }}
          path: results/snapshot-fork/
          if-no-files-found: ignore
          retention-days: 7

  collect:
    name: Collect Results
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe
    # runs-on: self-hosted
    needs: [snapshot-fork]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the rebase-on-push retry below has a merge base.
          # A shallow (depth-1) clone can make `git rebase origin/<branch>`
          # fail when the remote has advanced past the shallow boundary.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: namespacelabs/nscloud-setup@v0
      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm -r update --ignore-scripts
          else
            pnpm install --frozen-lockfile --ignore-scripts
          fi
          pnpm -r --filter './packages/**' run build
      - name: Download snapshot/fork artifacts
        uses: actions/download-artifact@v4
        with:
          path: sf-artifacts/
          pattern: snapshot-fork-results-*
      - name: Merge snapshot/fork results
        # Combines the per-provider artifacts into results/snapshot-fork/<dataset>/.
        # Guarded so a run with no snapshot/fork artifacts doesn't hard-fail.
        run: |
          if find sf-artifacts -name latest.json 2>/dev/null | grep -q .; then
            npx tsx benchmarks/src/merge-results.ts --input sf-artifacts --mode snapshot-fork
          else
            echo "No snapshot/fork artifacts to merge"
          fi
      - name: Generate snapshot/fork SVG
        # Guarded so a run with no snapshot/fork results (the generator exits
        # non-zero when none exist) doesn't fail the collect job.
        run: |
          if find results/snapshot-fork -name latest.json 2>/dev/null | grep -q .; then
            pnpm run generate-snapshot-fork-svg
          else
            echo "No snapshot/fork results to render"
          fi
      - name: Upload SVGs as artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-fork-benchmark-svgs
          path: snapshot_fork_*.svg
          if-no-files-found: ignore
          retention-days: 7
      - name: Post snapshot/fork results to merged PR
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Artifact layout: sf-artifacts/snapshot-fork-results-<provider>/snapshot-fork/<dataset>/latest.json
            // Composite scores are absolute (fixed latency ceiling), so each
            // per-provider file is already comparable — no merge/recompute needed.
            const files = [];
            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, e.name);
                if (e.isDirectory()) walk(full);
                else if (e.name === 'latest.json') files.push(full);
              }
            }
            walk('sf-artifacts');

            // Group results by dataset (inferred from the parent directory name).
            const byDataset = {};
            for (const file of files) {
              const dataset = path.basename(path.dirname(file));
              let data;
              try { data = JSON.parse(fs.readFileSync(file, 'utf-8')); } catch { continue; }
              for (const r of (data.results || [])) {
                (byDataset[dataset] ||= []).push(r);
              }
            }

            const prettyName = p => p === 'aws-s3' ? 'AWS S3' : p === 'cloudflare-r2' ? 'Cloudflare R2' : p.charAt(0).toUpperCase() + p.slice(1);
            const secs = ms => (ms / 1000).toFixed(2) + 's';

            let body = '## Snapshot/Fork Benchmark Results\n\n';
            let hasResults = false;

            for (const dataset of Object.keys(byDataset).sort()) {
              const results = byDataset[dataset]
                .slice()
                .sort((a, b) => (b.compositeScore || 0) - (a.compositeScore || 0));
              if (results.length === 0) continue;
              hasResults = true;

              body += `### ${dataset} dataset\n\n`;
              body += '| # | Provider | Score | Snapshot create | Fork (snapshot) | Fork (live) | First read | Status |\n';
              body += '|---|----------|-------|-----------------|-----------------|-------------|------------|--------|\n';

              results.forEach((r, i) => {
                const name = prettyName(r.provider);
                if (r.skipped) {
                  body += `| ${i + 1} | ${name} | -- | -- | -- | -- | -- | SKIPPED (${r.skipReason || ''}) |\n`;
                  return;
                }
                const score = r.compositeScore !== undefined ? r.compositeScore.toFixed(1) : '--';
                const snap = secs(r.summary.snapshotCreateMs.median);
                const forkSnap = secs(r.summary.forkFromSnapshotMs.median);
                const forkLive = secs(r.summary.forkFromLiveMs.median);
                const read = secs(r.summary.forkFirstReadMs.median);
                const ok = r.iterations.filter(it => !it.error && it.verified).length;
                const total = r.iterations.length;
                body += `| ${i + 1} | ${name} | ${score} | ${snap} | ${forkSnap} | ${forkLive} | ${read} | ${ok}/${total} |\n`;
              });

              body += '\n';
            }

            if (!hasResults) {
              body += '> No snapshot/fork benchmark results were generated.\n\n';
            }

            body += `---\n*[View full run](${runUrl})*`;

            // This push is a merge to master — post results to the PR it closed.
            // A commit can be associated with several PRs (backports, merge
            // queue), so pick the one merged into the branch we pushed to.
            const target = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pr = prs.find(p => p.merged_at && p.base.ref === target);
            if (!pr) {
              // Direct push with no associated PR — fall back to a commit comment.
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body,
              });
              return;
            }

            // Find and update existing comment or create new one
            const marker = '## Snapshot/Fork Benchmark Results';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
      - name: Commit and push
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml snapshot_fork_*.svg results/snapshot-fork/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update snapshot/fork benchmark results [skip ci]"

          # Remote master can advance during the run (concurrent benchmark
          # workflows push to master too), so a plain push fails non-fast-forward.
          # Rebase onto the latest remote and retry a few times before giving up.
          branch="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4 5; do
            # Rebase before each attempt (including the last) so every rebase
            # is followed by a push — otherwise the final iteration's rebase
            # would be wasted and a resolvable non-fast-forward could still fail.
            git fetch origin "${branch}"
            git rebase --autostash "origin/${branch}" || { git rebase --abort; exit 1; }
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); will rebase and retry"
          done
          echo "Failed to push after multiple attempts" >&2
          exit 1
