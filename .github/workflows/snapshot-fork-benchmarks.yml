name: Snapshot/Fork Benchmark

# computesdk:secrets=NSC_TOKEN
# computesdk:secrets-env=declared

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/storage/**'
  schedule:
    - cron: '30 11 * * 5' # Weekly on Friday at 11:30am UTC (6:30am CDT, offset from storage to avoid racing pushes to master)
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optional platform benchmark slug override'
        required: false
        default: ''
      name:
        description: 'Optional platform benchmark name override'
        required: false
        default: ''
      iterations:
        description: 'Iterations per provider'
        required: false
        default: '100'
      dataset:
        description: 'Dataset to test'
        required: false
        default: 'small'
        type: choice
        options:
          - small
          - wide
          - deep
      dry_run:
        description: 'Run without ingesting results'
        required: false
        default: false
        type: boolean
      trigger_source:
        description: 'Recorded on platform runs as their trigger (e.g. platform-retrigger); leave empty for a plain manual run'
        required: false
        default: ''
      trigger_requested_by:
        description: 'Who asked for this run (e.g. the platform org slug); recorded alongside trigger_source'
        required: false
        default: ''
      trigger_request_id:
        description: 'Platform re-trigger request id; recorded so the platform can link this run back to the request'
        required: false
        default: ''

concurrency:
  group: snapshot-fork-benchmarks
  cancel-in-progress: true

permissions:
  contents: read

  id-token: write

env:
  BENCHMARK_SLUG: ${{ github.event.inputs.slug || '' }}
  BENCH_TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || '' }}
  BENCH_TRIGGER_REQUESTED_BY: ${{ github.event.inputs.trigger_requested_by || '' }}
  BENCH_TRIGGER_REQUEST_ID: ${{ github.event.inputs.trigger_request_id || '' }}
  BENCHMARK_NAME: ${{ github.event.inputs.name || '' }}

jobs:
  snapshot-fork:
    name: Snapshot/Fork ${{ matrix.provider }}
    # One real snapshot+fork cycle per provider per iteration: each iteration
    # creates and tears down real buckets/objects, so iteration counts are kept
    # low (and on the smallest dataset) to bound cost and leak risk. PRs run a
    # single iteration; the weekly schedule runs 100 for trend data and commits
    # the combined results. Fork PRs without secrets skip gracefully
    # (missing-creds path) rather than failing.
    runs-on: ${{ matrix.provider == 'tigris' && 'computesdk:computesdk:aws-us-west-2' || 'namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe;permissions.additional_grant=vault/object:*:reveal' }}
    # runs-on: self-hosted
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        provider:
          - aws-s3
          - cloudflare-r2
          - tigris
          - azure-blob
          - tensorlake
          - archil
          - neon
          - mosaic
          # vercel-blob is disabled pending an adapter fix: its manifest-based
          # snapshot/fork emulation is unreliable on Vercel Blob's eventually-
          # consistent overwrites (stale reads + lost deletes). See providers.ts.
          # - vercel-blob
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      # ComputeSDK runners get no GitHub OIDC token, so nscloud-setup's
      # `nsc auth exchange-github-token` cannot work there. Pre-seed the
      # workload token file it checks for when NSC_TOKEN is available;
      # accepts either the raw bearer token or a full token JSON document.
      # It also exports NSC_DOCKER_LOGIN/NSC_CONTAINER_REGISTRY so
      # nscloud-setup skips `nsc docker login`, which this token is not
      # granted for — the benchmarks only need vault access.
      - name: Seed Namespace token file
        run: |
          if [ -n "${NSC_TOKEN:-}" ] && [ ! -f /var/run/nsc/token.json ]; then
            mkdir -p /var/run/nsc
            case "$NSC_TOKEN" in
              \{*) printf '%s\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
              *) printf '{"bearer_token":"%s"}\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
            esac
            chmod 600 /var/run/nsc/token.json
            # The seeded token has no container-registry grant; tell
            # nscloud-setup to skip `nsc docker login` for later steps.
            echo "NSC_DOCKER_LOGIN=1" >> "$GITHUB_ENV"
            echo "NSC_CONTAINER_REGISTRY=nscr.io" >> "$GITHUB_ENV"
          fi
      - uses: namespacelabs/nscloud-setup@v0
      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm -r update --ignore-scripts
          else
            pnpm install --frozen-lockfile --ignore-scripts
          fi
          pnpm -r --filter './packages/**' run build
      - name: Run snapshot/fork test
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_REGION|S3_BUCKET|S3_SNAPSHOT_ACCESS_KEY_ID|S3_SNAPSHOT_SECRET_ACCESS_KEY|S3_SNAPSHOT_BUCKET|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|R2_BUCKET|R2_ACCOUNT_ID|R2_SNAPSHOT_ACCESS_KEY_ID|R2_SNAPSHOT_SECRET_ACCESS_KEY|R2_SNAPSHOT_BUCKET|TIGRIS_STORAGE_ACCESS_KEY_ID|TIGRIS_STORAGE_SECRET_ACCESS_KEY|TIGRIS_STORAGE_BUCKET|TIGRIS_SNAPSHOT_ACCESS_KEY|TIGRIS_SNAPSHOT_SECRET_KEY|TIGRIS_SNAPSHOT_STORAGE_BUCKET|BLOB_READ_WRITE_TOKEN|VERCEL_BLOB_BUCKET|GCS_PROJECT_ID|GCS_BUCKET|GCS_CLIENT_EMAIL|GCS_PRIVATE_KEY|AZURE_ACCOUNT_NAME|AZURE_ACCOUNT_KEY|AZURE_CONTAINER|AZURE_SNAPSHOT_ACCOUNT_NAME|AZURE_SNAPSHOT_ACCOUNT_KEY|AZURE_SNAPSHOT_CONTAINER|TENSORLAKE_API_KEY|TENSORLAKE_API_URL|TENSORLAKE_ORGANIZATION_ID|TENSORLAKE_PROJECT_ID|TENSORLAKE_FILESYSTEM|ARCHIL_S3_ACCESS_KEY_ID|ARCHIL_S3_SECRET_ACCESS_KEY|ARCHIL_BUCKET|ARCHIL_REGION|ARCHIL_BRANCH|NEON_BUCKET|NEON_ENDPOINT|NEON_ACCESS_KEY_ID|NEON_SECRET_ACCESS_KEY|NEON_REGION|NEON_SNAPSHOT_BUCKET|NEON_SNAPSHOT_ENDPOINT|NEON_SNAPSHOT_ACCESS_KEY_ID|NEON_SNAPSHOT_SECRET_ACCESS_KEY|NEON_SNAPSHOT_REGION|MOSAIC_BUCKET|MOSAIC_ACCESS_KEY_ID|MOSAIC_SECRET_ACCESS_KEY|MOSAIC_REGION|MOSAIC_ENDPOINT|MOSAIC_SNAPSHOT_BUCKET|MOSAIC_SNAPSHOT_ACCESS_KEY_ID|MOSAIC_SNAPSHOT_SECRET_ACCESS_KEY|MOSAIC_SNAPSHOT_REGION|MOSAIC_SNAPSHOT_ENDPOINT|BENCHMARKS_PLATFORM_API_KEY)'

          # All matrix jobs for this workflow run share a single platform run. The
          # attempt number is included so re-runs do not rejoin completed runs.
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The benchmark gets a 60-minute wall-clock budget via the runner's own
          # deadline: on expiry it stops launching iterations, drains in-flight
          # work, and submits partial results, so the job completes instead of
          # failing on a timeout(1) kill. `timeout 75m` stays as a hard backstop
          # (under the job's 90-minute cap) for a drain that itself hangs.
          timeout 75m npx tsx packages/benchsdk-runner/dist/bin.js run benchmarks/storage/snapshot-fork.bench.ts \
            --provider ${{ matrix.provider }} \
            --dataset ${{ github.event.inputs.dataset || 'small' }} \
            --iterations ${{ (github.event_name == 'schedule' && '100') || github.event.inputs.iterations || (github.event_name == 'push' && '1') || '3' }} \
            --run-key "$RUN_KEY" \
            --deadline-ms 3600000 \
            ${{ (github.event_name == 'push' || github.event.inputs.dry_run == 'true') && '--no-ingest' || '' }}
