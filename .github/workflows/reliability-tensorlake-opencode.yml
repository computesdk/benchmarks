name: Tensorlake OpenCode Reliability

# computesdk:secrets=NSC_TOKEN
# computesdk:secrets-env=declared

on:
  schedule:
    - cron: '0 * * * *' # top of every hour: 60 one-minute iterations per run
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optional platform benchmark slug override'
        required: false
        default: ''
      name:
        description: 'Optional platform benchmark name override'
        required: false
        default: ''
      iterations:
        description: 'Iterations per run'
        required: false
        default: '60'
      stagger_delay_ms:
        description: 'Delay between task starts (ms)'
        required: false
        default: '60000'
      dry_run:
        description: 'Run without ingesting or committing results'
        required: false
        default: false
        type: boolean

concurrency:
  group: tensorlake-opencode-reliability
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BENCHMARK_SLUG: ${{ github.event.inputs.slug || '' }}
  BENCHMARK_NAME: ${{ github.event.inputs.name || '' }}

jobs:
  bench:
    name: Tensorlake OpenCode Reliability
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      # ComputeSDK runners get no GitHub OIDC token, so nscloud-setup's
      # `nsc auth exchange-github-token` cannot work there. Pre-seed the
      # workload token file it checks for when NSC_TOKEN is available;
      # accepts either the raw bearer token or a full token JSON document.
      # It also exports NSC_DOCKER_LOGIN/NSC_CONTAINER_REGISTRY so
      # nscloud-setup skips `nsc docker login`, which this token is not
      # granted for — the benchmarks only need vault access.
      - name: Seed Namespace token file
        run: |
          if [ -n "${NSC_TOKEN:-}" ] && [ ! -f /var/run/nsc/token.json ]; then
            mkdir -p /var/run/nsc
            case "$NSC_TOKEN" in
              \{*) printf '%s\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
              *) printf '{"bearer_token":"%s"}\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
            esac
            chmod 600 /var/run/nsc/token.json
            # The seeded token has no container-registry grant; tell
            # nscloud-setup to skip `nsc docker login` for later steps.
            echo "NSC_DOCKER_LOGIN=1" >> "$GITHUB_ENV"
            echo "NSC_CONTAINER_REGISTRY=nscr.io" >> "$GITHUB_ENV"
          fi
      - uses: namespacelabs/nscloud-setup@v0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load secrets and run benchmark
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '60' }}
          STAGGER_DELAY_MS: ${{ github.event.inputs.stagger_delay_ms || '60000' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(TENSORLAKE_API_KEY|BENCHMARKS_PLATFORM_API_KEY)='
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ITERATIONS="${ITERATIONS:-60}"
          STAGGER_DELAY_MS="${STAGGER_DELAY_MS:-60000}"
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--no-ingest"
          else
            DRY_RUN_FLAG=""
          fi
          pnpm exec bench run benchmarks/reliability/sandbox-opencode.bench.ts \
            --provider tensorlake \
            --iterations "$ITERATIONS" \
            --stagger-delay-ms "$STAGGER_DELAY_MS" \
            --run-key "$RUN_KEY" \
            $DRY_RUN_FLAG
