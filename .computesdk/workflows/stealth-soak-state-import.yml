name: Stealth — Import Soak State

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Sandbox provider whose old soak workflow has stopped'
        required: true
        type: string
      state_json:
        description: 'Full provider state JSON exported privately from the old repository'
        required: true
        type: string

permissions:
  contents: read

# Share the soak workflow lock so an import cannot race a manual soak shift.
concurrency:
  group: bench-sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-state:
    # State handoff must happen on the production ref before enabling the new schedules.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && vars.STEALTH_BENCHMARKS_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate and stage provider state without logging it
        env:
          SOAK_PROVIDER: ${{ inputs.provider }}
          SOAK_STATE_JSON: ${{ inputs.state_json }}
        run: node benchmarks/stealth/scripts/import-soak-state.mjs
      - name: Check for previously seeded or active state
        id: existing
        uses: actions/cache/restore@v4
        with:
          path: results/sandbox_soak/state/${{ inputs.provider }}.json
          key: soak-state-${{ github.ref_name }}-${{ inputs.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            soak-state-${{ github.ref_name }}-${{ inputs.provider }}-
          lookup-only: true
      - name: Refuse to overwrite existing provider state
        env:
          MATCHED_KEY: ${{ steps.existing.outputs.cache-matched-key }}
        run: |
          if [ -n "$MATCHED_KEY" ]; then
            echo 'Provider state already exists; refusing to replace it with an older export.' >&2
            exit 1
          fi
      - name: Seed the provider cache for its first production shift
        uses: actions/cache/save@v4
        with:
          path: results/sandbox_soak/state/${{ inputs.provider }}.json
          key: soak-state-${{ github.ref_name }}-${{ inputs.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify seeded state is readable from the platform cache
        id: seeded
        uses: actions/cache/restore@v4
        with:
          path: results/sandbox_soak/state/${{ inputs.provider }}.json
          key: soak-state-${{ github.ref_name }}-${{ inputs.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: true
      - name: Require a successful state upload
        env:
          CACHE_HIT: ${{ steps.seeded.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != 'true' ]; then
            echo 'Seeded state could not be read back; do not start a production soak shift.' >&2
            exit 1
          fi
