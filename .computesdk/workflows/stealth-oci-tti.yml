name: Stealth — OCI Boot TTI

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Run only this provider (empty = all)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Skip ingestion into benchmarks-platform'
        required: true
        default: true
        type: boolean
      iterations:
        description: 'Iterations per provider'
        required: true
        default: '5'
        type: string
      materialize:
        description: 'Materialize OCI artifacts instead of benchmarking (rebuilds templates and commits oci-tti-artifacts.json)'
        required: true
        default: false
        type: boolean
      vercel_image_ref:
        description: 'VCR-pushed image ref to record for vercel (materialize only)'
        required: false
        default: ''
        type: string
      benchmark_slug:
        description: 'Benchmark slug for platform ingestion'
        required: true
        default: 'oci-tti'
        type: string
      benchmark_name:
        description: 'Benchmark name for platform ingestion'
        required: true
        default: 'OCI Boot TTI'
        type: string
      trigger_source:
        description: 'Recorded on platform runs as their trigger (e.g. platform-retrigger); leave empty for a plain manual run'
        required: false
        default: ''
        type: string
      trigger_requested_by:
        description: 'Who asked for this run (e.g. the platform org slug); recorded alongside trigger_source'
        required: false
        default: ''
        type: string
      trigger_request_id:
        description: 'Platform re-trigger request id; recorded so the platform can link this run back to the request'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: oci-tti-${{ github.ref }}
  cancel-in-progress: false

env:
  BENCHMARK_NAME: ${{ github.event.inputs.benchmark_name || (github.event_name == 'schedule' && 'OCI Boot TTI - Stealth') || 'OCI Boot TTI' }}
  BENCHMARK_SLUG: ${{ github.event.inputs.benchmark_slug || (github.event_name == 'schedule' && 'oci-tti-stealth') || 'oci-tti' }}

jobs:
  materialize:
    name: materialize-${{ matrix.provider }}
    if: github.event_name == 'workflow_dispatch' && inputs.materialize == true
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe;permissions.additional_grant=vault/object:*:reveal
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      SHOULD_RUN: ${{ github.event.inputs.provider == '' || github.event.inputs.provider == matrix.provider }}
    strategy:
      fail-fast: false
      matrix:
        provider:
          - blaxel
          - codesandbox
          - e2b
          - sfcompute
          - gravixlayer
          - lelantos
          - mosaic
          - novita
          - superserve
          - vercel
    steps:
      - uses: actions/checkout@v4
        if: env.SHOULD_RUN == 'true'
      - name: Seed Namespace token file
        if: env.SHOULD_RUN == 'true'
        env:
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
        run: |
          if [ -n "${NSC_TOKEN:-}" ] && [ ! -f /var/run/nsc/token.json ]; then
            mkdir -p /var/run/nsc
            case "$NSC_TOKEN" in
              \{*) printf '%s\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
              *) printf '{"bearer_token":"%s"}\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
            esac
            chmod 600 /var/run/nsc/token.json
            echo "NSC_DOCKER_LOGIN=1" >> "$GITHUB_ENV"
            echo "NSC_CONTAINER_REGISTRY=nscr.io" >> "$GITHUB_ENV"
          fi
      - uses: namespacelabs/nscloud-setup@v0
        if: env.SHOULD_RUN == 'true'
      - uses: pnpm/action-setup@v4
        if: env.SHOULD_RUN == 'true'
      - uses: actions/setup-node@v4
        if: env.SHOULD_RUN == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        if: env.SHOULD_RUN == 'true'
        run: pnpm install
      - name: Build workspace packages
        if: env.SHOULD_RUN == 'true'
        run: pnpm -r --filter './packages/**' run build
      - name: Materialize OCI artifact
        if: env.SHOULD_RUN == 'true'
        env:
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
          PROVIDER: ${{ matrix.provider }}
          OCI_TTI_VERCEL_IMAGE: ${{ github.event.inputs.vercel_image_ref || '' }}
        run: |
          case "$PROVIDER" in
            blaxel) PROVIDER_KEYS='BL_API_KEY|BL_WORKSPACE' ;;
            codesandbox) PROVIDER_KEYS='CSB_API_KEY' ;;
            e2b) PROVIDER_KEYS='E2B_API_KEY' ;;
            sfcompute) PROVIDER_KEYS='' ;;
            gravixlayer) PROVIDER_KEYS='GRAVIXLAYER_API_KEY' ;;
            lelantos) PROVIDER_KEYS='LELANTOS_API_KEY|LELANTOS_DOMAIN' ;;
            mosaic) PROVIDER_KEYS='MOSAIC_API_URL|MOSAIC_API_TOKEN' ;;
            novita) PROVIDER_KEYS='NOVITA_API_KEY' ;;
            superserve) PROVIDER_KEYS='SUPERSERVE_API_KEY' ;;
            vercel) PROVIDER_KEYS='' ;;
            *) PROVIDER_KEYS='' ;;
          esac
          if [ -n "$PROVIDER_KEYS" ]; then
            KEYS="^(${PROVIDER_KEYS})="
            . ./benchmarks/stealth/scripts/load-vault-secrets.sh "$KEYS"
          fi

          set -o pipefail
          # Array form, never eval: dispatch inputs reach this shell.
          CMD=(pnpm stealth:materialize:oci-tti --provider "$PROVIDER")
          if [ "${PROVIDER}" = "vercel" ] && [ -n "${OCI_TTI_VERCEL_IMAGE}" ]; then
            CMD+=(--image-ref "$OCI_TTI_VERCEL_IMAGE")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"
      - name: Write this provider's artifact part
        if: always() && env.SHOULD_RUN == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          # Upload only this provider's key: parallel matrix jobs each hold a
          # full-registry copy and merging whole files would resurrect stale
          # refs from jobs that ran before a sibling's rebuild.
          node -e '
            const fs = require("fs");
            const reg = JSON.parse(fs.readFileSync("benchmarks/stealth/sandbox/oci-tti-artifacts.json", "utf-8"));
            const p = process.env.PROVIDER;
            const out = { image: reg.image, artifacts: {} };
            if (reg.artifacts?.[p]) out.artifacts[p] = reg.artifacts[p];
            fs.writeFileSync("oci-artifacts-part.json", JSON.stringify(out, null, 2) + "\n");
          '
      - name: Upload updated artifact registry
        if: always() && env.SHOULD_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oci-artifacts-${{ matrix.provider }}
          path: oci-artifacts-part.json
          if-no-files-found: ignore

  commit-artifacts:
    name: commit-artifacts
    needs: materialize
    if: always() && github.event_name == 'workflow_dispatch' && inputs.materialize == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download updated artifact registries
        uses: actions/download-artifact@v4
        with:
          path: artifact-parts
          pattern: oci-artifacts-*
      - name: Merge artifact registries
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const base = JSON.parse(fs.readFileSync("benchmarks/stealth/sandbox/oci-tti-artifacts.json", "utf-8"));
            base.artifacts ||= {};
            for (const dir of fs.readdirSync("artifact-parts")) {
              const f = path.join("artifact-parts", dir, "oci-artifacts-part.json");
              if (!fs.existsSync(f)) continue;
              const part = JSON.parse(fs.readFileSync(f, "utf-8"));
              for (const [k, v] of Object.entries(part.artifacts || {})) base.artifacts[k] = v;
            }
            fs.writeFileSync("benchmarks/stealth/sandbox/oci-tti-artifacts.json", JSON.stringify(base, null, 2) + "\n");
          '
      - name: Commit and push artifact registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/stealth/sandbox/oci-tti-artifacts.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: materialize oci-tti artifacts [skip ci]"
            pushed=false
            for i in 1 2 3; do
              git pull --rebase && git push && { pushed=true; break; }
              echo "push attempt $i failed; retrying"
              sleep 5
            done
            [ "$pushed" = true ] || exit 1
          fi

  bench:
    name: bench-${{ matrix.provider }}
    if: github.event_name == 'schedule' || inputs.materialize != true
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe;permissions.additional_grant=vault/object:*:reveal
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      BENCH_RESULTS_DIR: results/current-${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.provider }}
      SHOULD_RUN: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.provider == '' || github.event.inputs.provider == matrix.provider }}
    strategy:
      fail-fast: false
      matrix:
        provider:
          # Every sandbox provider runs. Providers with no wired OCI boot path (no
          # OCI_PARTICIPANTS spec in oci-tti.ts) or no materialized artifact record a
          # failed `oci_tti_unsupported` task, so they score 0 instead of vanishing.
          - agent37
          - archil
          - arker
          - beam
          - blaxel
          - boat
          - buddy
          - cloud-run
          - cloudflare
          - codesandbox
          - createos
          - daytona
          - e2b
          - freestyle
          - sfcompute
          - gravixlayer
          - hopx
          - isorun
          - lelantos
          - microsandbox
          - miosa
          - modal
          - mosaic
          - namespace
          - neevcloud
          - northflank
          - novita
          - promigence
          - sail
          - run-cloud
          - sandbox0
          - styne
          - superserve
          - luxor
          - tensorlake
          - upstash
          - vercel
    steps:
      - uses: actions/checkout@v4
        if: env.SHOULD_RUN == 'true'
      # ComputeSDK runners get no GitHub OIDC token, so nscloud-setup's
      # `nsc auth exchange-github-token` cannot work there. Pre-seed the
      # workload token file it checks for when NSC_TOKEN is available;
      # accepts either the raw bearer token or a full token JSON document.
      # It also exports NSC_DOCKER_LOGIN/NSC_CONTAINER_REGISTRY so
      # nscloud-setup skips `nsc docker login`, which this token is not
      # granted for — the benchmarks only need vault access.
      - name: Seed Namespace token file
        if: env.SHOULD_RUN == 'true'
        env:
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
        run: |
          if [ -n "${NSC_TOKEN:-}" ] && [ ! -f /var/run/nsc/token.json ]; then
            mkdir -p /var/run/nsc
            case "$NSC_TOKEN" in
              \{*) printf '%s\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
              *) printf '{"bearer_token":"%s"}\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
            esac
            chmod 600 /var/run/nsc/token.json
            echo "NSC_DOCKER_LOGIN=1" >> "$GITHUB_ENV"
            echo "NSC_CONTAINER_REGISTRY=nscr.io" >> "$GITHUB_ENV"
          fi
      - uses: namespacelabs/nscloud-setup@v0
        if: env.SHOULD_RUN == 'true'
      - uses: pnpm/action-setup@v4
        if: env.SHOULD_RUN == 'true'
      - uses: actions/setup-node@v4
        if: env.SHOULD_RUN == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        if: env.SHOULD_RUN == 'true'
        run: pnpm install
      - name: Build workspace packages
        if: env.SHOULD_RUN == 'true'
        run: pnpm -r --filter './packages/**' run build
      - name: Run OCI Boot TTI benchmark
        if: env.SHOULD_RUN == 'true'
        id: run-bench
        env:
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
          PROVIDER: ${{ matrix.provider }}
          # Sandbox family: dedicated VM per create() instead of shared-disk exec.
          ARCHIL_EXECUTION: persistent
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          ITERATIONS: ${{ github.event.inputs.iterations || '5' }}
          BENCHMARKS_PLATFORM_API_KEY: ${{ secrets.BENCHMARKS_PLATFORM_API_KEY }}
          BENCHMARKS_PLATFORM_URL: ${{ secrets.BENCHMARKS_PLATFORM_URL }}
          RUN_KEY: ${{ github.run_id }}
          BENCH_TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || '' }}
          BENCH_TRIGGER_REQUESTED_BY: ${{ github.event.inputs.trigger_requested_by || '' }}
          BENCH_TRIGGER_REQUEST_ID: ${{ github.event.inputs.trigger_request_id || '' }}
        run: |
          COMMON_KEYS='BENCHMARKS_PLATFORM_API_KEY'
          case "$PROVIDER" in
            agent37) PROVIDER_KEYS='AGENT37_API_KEY' ;;
            archil) PROVIDER_KEYS='ARCHIL_API_KEY|ARCHIL_REGION|ARCHIL_DISK_ID_SANDBOX' ;;
            arker) PROVIDER_KEYS='ARKER_API_KEY' ;;
            beam) PROVIDER_KEYS='BEAM_TOKEN|BEAM_WORKSPACE_ID' ;;
            blaxel) PROVIDER_KEYS='BL_API_KEY|BL_WORKSPACE' ;;
            boat) PROVIDER_KEYS='BOAT_API_KEY' ;;
            buddy) PROVIDER_KEYS='BUDDY_TOKEN|BUDDY_WORKSPACE|BUDDY_PROJECT' ;;
            cloud-run) PROVIDER_KEYS='CLOUD_RUN_SANDBOX_URL|CLOUD_RUN_SANDBOX_SECRET' ;;
            cloudflare) PROVIDER_KEYS='CLOUDFLARE_SANDBOX_URL|SANDBOX_API_KEY' ;;
            codesandbox) PROVIDER_KEYS='CSB_API_KEY' ;;
            createos) PROVIDER_KEYS='CREATEOS_SANDBOX_API_KEY' ;;
            daytona) PROVIDER_KEYS='DAYTONA_API_KEY' ;;
            e2b) PROVIDER_KEYS='E2B_API_KEY' ;;
            freestyle) PROVIDER_KEYS='FREESTYLE_API_KEY' ;;
            sfcompute) PROVIDER_KEYS='GMN_TOKEN|GMN_API_HOST' ;;
            gravixlayer) PROVIDER_KEYS='GRAVIXLAYER_API_KEY' ;;
            hopx) PROVIDER_KEYS='HOPX_API_KEY' ;;
            isorun) PROVIDER_KEYS='ISORUN_API_KEY' ;;
            lelantos) PROVIDER_KEYS='LELANTOS_API_KEY|LELANTOS_DOMAIN' ;;
            microsandbox) PROVIDER_KEYS='MSB_API_KEY' ;;
            miosa) PROVIDER_KEYS='MIOSA_API_KEY' ;;
            modal) PROVIDER_KEYS='MODAL_TOKEN_ID|MODAL_TOKEN_SECRET' ;;
            mosaic) PROVIDER_KEYS='MOSAIC_API_URL|MOSAIC_API_TOKEN' ;;
            namespace) PROVIDER_KEYS='NSC_TOKEN' ;;
            neevcloud) PROVIDER_KEYS='NEEVCLOUD_API_KEY' ;;
            northflank) PROVIDER_KEYS='NORTHFLANK_TOKEN|NORTHFLANK_PROJECT_ID' ;;
            novita) PROVIDER_KEYS='NOVITA_API_KEY' ;;
            promigence) PROVIDER_KEYS='PROMIGENCE_API_KEY' ;;
            sail) PROVIDER_KEYS='SAIL_API_KEY' ;;
            run-cloud) PROVIDER_KEYS='RUN_CLOUD_API_KEY' ;;
            sandbox0) PROVIDER_KEYS='SANDBOX0_TOKEN' ;;
            styne) PROVIDER_KEYS='STYNE_API_KEY' ;;
            superserve) PROVIDER_KEYS='SUPERSERVE_API_KEY' ;;
            luxor) PROVIDER_KEYS='TENKI_API_KEY' ;;
            tensorlake) PROVIDER_KEYS='TENSORLAKE_API_KEY' ;;
            upstash) PROVIDER_KEYS='UPSTASH_BOX_API_KEY' ;;
            vercel) PROVIDER_KEYS='VERCEL_TOKEN|VERCEL_TEAM_ID|VERCEL_PROJECT_ID' ;;
            *) PROVIDER_KEYS='' ;;
          esac
          if [ -n "$PROVIDER_KEYS" ]; then
            KEYS="^(${COMMON_KEYS}|${PROVIDER_KEYS})="
          else
            KEYS="^(${COMMON_KEYS})="
          fi
          . ./benchmarks/stealth/scripts/load-vault-secrets.sh "$KEYS"
          if [ -n "${ARCHIL_DISK_ID_SANDBOX:-}" ]; then export ARCHIL_DISK_ID="$ARCHIL_DISK_ID_SANDBOX"; fi

          set -o pipefail
          mkdir -p results
          # Empty platform env vars must not survive: @benchsdk/runner >=0.3.0
          # resolves the platform URL with ?? so an empty string overrides the
          # built-in default and the ingest URL fails to parse.
          [ -z "$BENCHMARKS_PLATFORM_URL" ] && unset BENCHMARKS_PLATFORM_URL
          [ -z "$BENCHMARKS_PLATFORM_API_KEY" ] && unset BENCHMARKS_PLATFORM_API_KEY
          # No `pnpm bench:stealth --` separator: @benchsdk/runner >=0.3.0 validates
          # flags strictly and rejects a bare `--` in argv.
          [[ "$ITERATIONS" =~ ^[0-9]+$ ]] || { echo "invalid iterations: $ITERATIONS" >&2; exit 1; }
          # Array form, never eval: dispatch inputs reach this shell.
          CMD=(pnpm bench:stealth benchmarks/stealth/sandbox/oci-tti.bench.ts --provider "$PROVIDER" --iterations "$ITERATIONS" --run-key "$RUN_KEY")
          if [ "${DRY_RUN}" = "true" ]; then
            CMD+=(--no-ingest)
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"
