# computesdk:reliability
#
# Reliability run — excluded from the normal run feeds and counted by the
# reliability slot engine instead of ranked against other benchmarks.

# Vault: NSC_TOKEN is injected for `nsc vault export`; the per-provider API
# keys themselves come from the vault load step below.
# computesdk:secrets=NSC_TOKEN
# computesdk:secrets-env=declared
name: Stealth — Sandbox Reliability

on:
  schedule:
    - cron: "* * * * *"

permissions: {}

jobs:
  sandbox-reliability:
    name: Sandbox Reliability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The marker line lands in the Actions log even if everything below it
      # fails, so "did this run execute at all" is answerable from the log
      # alone.
      - name: Confirm runner
        run: |
          echo "RELIABILITY_OK ts=$(date -u +%FT%TZ) host=$(hostname) ciRun=${COMPUTESDK_RUN_ID:-unknown} slot=${COMPUTESDK_SCHEDULED_FOR:-unknown} ref=${GITHUB_REF_NAME:-unknown} sha=${GITHUB_SHA:-unknown}"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -r --filter './packages/**' run build

      # One benchmark run per fire: the platform's run id is unique per fire
      # and stable across a retry of the same fire, so --run-key makes the
      # report idempotent without merging distinct fires together.
      # --scheduled-for carries the slot the platform assigned this fire to
      # (COMPUTESDK_SCHEDULED_FOR, set only on scheduled fires — dispatch
      # leaves it empty and the run lands in the nearest open slot).
      - name: Run Sandbox Reliability benchmark
        env:
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
          BENCHMARKS_PLATFORM_URL: https://platform.computesdk.com
          BENCHMARKS_PLATFORM_API_KEY: ${{ secrets.BENCHMARKS_PLATFORM_API_KEY }}
        run: |
          # The platform seeds /var/run/nsc on namespace runners; on any
          # other driver seed the injected token so nsc can load the vault.
          if [ -n "${NSC_TOKEN:-}" ] && [ ! -f /var/run/nsc/token.json ]; then
            mkdir -p /var/run/nsc
            case "$NSC_TOKEN" in
              \{*) printf '%s\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
              *) printf '{"bearer_token":"%s"}\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
            esac
            chmod 600 /var/run/nsc/token.json
          fi
          export PATH="$HOME/.local/bin:$HOME/.ns/bin:$PATH"
          if ! command -v nsc >/dev/null 2>&1; then
            curl -fsSL https://get.namespace.so/cloud/install.sh | sh || true
          fi
          if command -v nsc >/dev/null 2>&1; then
            . ./benchmarks/stealth/scripts/load-vault-secrets.sh '^(AGENT37_API_KEY|ARCHIL_API_KEY|ARCHIL_DISK_ID_SANDBOX|ARCHIL_REGION|ARKER_API_KEY|BEAM_TOKEN|BEAM_WORKSPACE_ID|BENCHMARKS_PLATFORM_API_KEY|BL_API_KEY|BL_WORKSPACE|BOAT_API_KEY|BOAT_API_KEY|BRIQ_API_KEY|BUDDY_PROJECT|BUDDY_TOKEN|BUDDY_WORKSPACE|CLOUDFLARE_SANDBOX_URL|CLOUD_RUN_SANDBOX_SECRET|CLOUD_RUN_SANDBOX_URL|COLLIMATE_API_KEY|DAYTONA_API_KEY|E2B_API_KEY|FREESTYLE_API_KEY|GMN_TOKEN|HOPX_API_KEY|ISORUN_API_KEY|KOSA8_API_KEY|LELANTOS_API_KEY|LIGHTNING_API_KEY|MIOSA_API_KEY|MODAL_TOKEN_ID|MODAL_TOKEN_SECRET|MOSAIC_API_TOKEN|MOSAIC_API_URL|MSB_API_KEY|NEEVCLOUD_API_KEY|NORTHFLANK_PROJECT_ID|NORTHFLANK_TOKEN|NOVITA_API_KEY|NSC_TOKEN|OPENCOMPUTER_API_KEY|OPENCOMPUTER_API_URL|QUILT_API_KEY|QUILT_BASE_URL|RAILWAY_API_TOKEN|RAILWAY_ENVIRONMENT_ID|RUNLOOP_API_KEY|RUN_CLOUD_API_KEY|SAIL_API_KEY|SANDBOX0_TOKEN|SANDBOX_API_KEY|SPRITES_TOKEN|STYNE_API_KEY|SUPERSERVE_API_KEY|TENKI_API_KEY|TENSORLAKE_API_KEY|UNO_API_KEY|UPSTASH_BOX_API_KEY|VERCEL_PROJECT_ID|VERCEL_TEAM_ID|VERCEL_TOKEN)=' || true
            if [ -n "${ARCHIL_DISK_ID_SANDBOX:-}" ]; then export ARCHIL_DISK_ID="$ARCHIL_DISK_ID_SANDBOX"; fi
          fi
          SCHEDULED_FOR="${COMPUTESDK_SCHEDULED_FOR:-}"
          CMD=(pnpm bench:stealth benchmarks/stealth/sandbox/sandbox-reliability.bench.ts --run-key "${COMPUTESDK_RUN_ID:-$GITHUB_RUN_ID}")
          if [ -n "$SCHEDULED_FOR" ]; then
            CMD+=(--scheduled-for "$SCHEDULED_FOR")
          fi
          "${CMD[@]}"
