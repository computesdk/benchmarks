name: Stealth — Sandbox Volumes

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Run only this provider (empty = all)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Skip ingestion into benchmarks-platform'
        required: true
        default: true
        type: boolean
      iterations:
        description: 'Full lifecycle iterations per provider (1 for smoke)'
        required: true
        default: '4'
        type: string
      benchmark_slug:
        description: 'Benchmark slug for platform ingestion'
        required: true
        default: 'sandbox-volumes'
        type: string
      benchmark_name:
        description: 'Benchmark name for platform ingestion'
        required: true
        default: 'Sandbox Volumes'
        type: string
      trigger_source:
        description: 'Recorded on platform runs as their trigger (e.g. platform-retrigger); leave empty for a plain manual run'
        required: false
        default: ''
        type: string
      trigger_requested_by:
        description: 'Who asked for this run (e.g. the platform org slug); recorded alongside trigger_source'
        required: false
        default: ''
        type: string
      trigger_request_id:
        description: 'Platform re-trigger request id; recorded so the platform can link this run back to the request'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 14 * * *' # Daily 8am CT (hourly-staggered sandbox suite)

concurrency:
  group: sandbox-volumes-${{ github.ref }}
  cancel-in-progress: false

env:
  BENCHMARK_NAME: ${{ github.event.inputs.benchmark_name || (github.event_name == 'schedule' && 'Sandbox Volumes - Stealth') || 'Sandbox Volumes' }}
  BENCHMARK_SLUG: ${{ github.event.inputs.benchmark_slug || (github.event_name == 'schedule' && 'sandbox-volumes-stealth') || 'sandbox-volumes' }}

jobs:
  bench:
    name: volumes-${{ matrix.provider }}
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe;permissions.additional_grant=vault/object:*:reveal
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      BENCH_RESULTS_DIR: results/current-${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.provider }}
      SHOULD_RUN: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.provider == '' || github.event.inputs.provider == matrix.provider }}
    strategy:
      fail-fast: false
      matrix:
        provider:
          # Every sandbox provider runs. Providers without a volume adapter in
          # volumes-adapters.ts fail fast with volumes_not_supported (volumeSupported=false),
          # so they score 0 and the results table doubles as the capability matrix.
          # cloud-run also hosts the egress-probe step below (standalone jobs on this
          # runner get detached-then-cancelled).
          - agent37
          - archil
          - arker
          - beam
          - blaxel
          - boat
          - briq
          - buddy
          - cloud-run
          - cloudflare
          - codesandbox
          - createos
          - daytona
          - e2b
          - freestyle
          - sfcompute
          - gravixlayer
          - hopx
          - isorun
          - kosa8
          - lelantos
          - microsandbox
          - miosa
          - modal
          - mosaic
          - namespace
          - neevcloud
          - northflank
          - novita
          - promigence
          - sail
          - run-cloud
          - sandbox0
          - styne
          - superserve
          - luxor
          - tensorlake
          - uno
          - upstash
          - vercel
    steps:
      - uses: actions/checkout@v4
        if: env.SHOULD_RUN == 'true'
      # ComputeSDK runners get no GitHub OIDC token, so nscloud-setup's
      # `nsc auth exchange-github-token` cannot work there. Pre-seed the
      # workload token file it checks for when NSC_TOKEN is available;
      # accepts either the raw bearer token or a full token JSON document.
      # It also exports NSC_DOCKER_LOGIN/NSC_CONTAINER_REGISTRY so
      # nscloud-setup skips `nsc docker login`, which this token is not
      # granted for — the benchmarks only need vault access.
      - name: Seed Namespace token file
        if: env.SHOULD_RUN == 'true'
        env:
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
        run: |
          if [ -n "${NSC_TOKEN:-}" ] && [ ! -f /var/run/nsc/token.json ]; then
            mkdir -p /var/run/nsc
            case "$NSC_TOKEN" in
              \{*) printf '%s\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
              *) printf '{"bearer_token":"%s"}\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
            esac
            chmod 600 /var/run/nsc/token.json
            echo "NSC_DOCKER_LOGIN=1" >> "$GITHUB_ENV"
            echo "NSC_CONTAINER_REGISTRY=nscr.io" >> "$GITHUB_ENV"
          fi
      - uses: namespacelabs/nscloud-setup@v0
        if: env.SHOULD_RUN == 'true'
      - uses: pnpm/action-setup@v4
        if: env.SHOULD_RUN == 'true'
      - uses: actions/setup-node@v4
        if: env.SHOULD_RUN == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        if: env.SHOULD_RUN == 'true'
        run: pnpm install
      - name: Build workspace packages
        if: env.SHOULD_RUN == 'true'
        run: pnpm -r --filter './packages/**' run build
      - name: Diag — cloud-run egress probe
        # Diagnostic lane for the cloud-run EAI_AGAIN investigation: probes
        # the deployed gateway directly to tell a stale gateway image
        # (predates allowEgress) apart from a Google-side network block.
        # Trigger: dispatch with trigger_source=cloud-run-egress-probe
        # (undeclared inputs can't be dispatched; trigger_source is declared
        # on main). Output lands in the cloud-run-egress-probe artifact too.
        if: env.SHOULD_RUN == 'true' && matrix.provider == 'cloud-run' && github.event.inputs.trigger_source == 'cloud-run-egress-probe'
        env:
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
        run: |
          mkdir -p probe-output
          exec > >(tee probe-output/probe.txt) 2>&1

          . ./benchmarks/stealth/scripts/load-vault-secrets.sh '^(CLOUD_RUN_SANDBOX_URL|CLOUD_RUN_SANDBOX_SECRET)='
          GW="${CLOUD_RUN_SANDBOX_URL%/}"
          echo "GW_HOST=$(echo "$CLOUD_RUN_SANDBOX_URL" | sed 's|https://||;s|/.*||')"

          # Gateway confirmed v1 (workdir/rootfs/runArgs ignored). Now test
          # whether a NESTED `sandbox do --allow-egress` inside the sandbox
          # restores egress — the binary ships in the image (its --help ran
          # inside the sandbox in the previous probe).
          cat > /tmp/probe.sh <<'EOF'
          echo "OUTER-DNS: $(getent hosts registry.npmjs.org >/dev/null 2>&1 && echo OK || echo FAIL)"
          echo "SUBCOMMANDS:"
          /usr/local/gcp/bin/sandbox --help 2>&1 | sed -n '/Commands:/,$p' | head -15
          echo "=== NESTED do --allow-egress ==="
          /usr/local/gcp/bin/sandbox do --allow-egress -- sh -c 'echo "INNER-DNS: $(getent hosts registry.npmjs.org >/dev/null 2>&1 && echo OK || echo FAIL)"' 2>&1 | tail -25
          echo "=== NESTED exit: $? ==="
          EOF

          post() {
            echo ">>> POST $1  body=$2"
            curl -sS -m 180 -X POST "$GW$1" \
              -H 'Content-Type: application/json' \
              -H "X-ComputeSDK-Cloud-Run-Secret: $CLOUD_RUN_SANDBOX_SECRET" \
              -d "$2" || true
            echo
          }

          PROBE_CMD=$(cat /tmp/probe.sh)

          echo '=== /v1/health ==='
          curl -sS -m 10 "$GW/v1/health" || true; echo

          echo '=== G) nested sandbox do --allow-egress ==='
          post /v1/sandbox/do "$(jq -n --arg c "$PROBE_CMD" '{command: $c}')"

          echo '=== H) GCS SA can see the computesdk-sandbox service? ==='
          . ./benchmarks/stealth/scripts/load-vault-secrets.sh '^(GCS_PROJECT_ID|GCS_CLIENT_EMAIL|GCS_PRIVATE_KEY)=' || echo "no GCS creds in vault"
          if [ -n "${GCS_PRIVATE_KEY:-}" ]; then
            printf '%s' "$GCS_PRIVATE_KEY" | tr -cd 'A-Za-z0-9+/=' | base64 -d | sed 's/\\n/\n/g' > /tmp/pk.pem
            head -1 /tmp/pk.pem
            wc -l /tmp/pk.pem
            jq -n --arg t service_account --rawfile pe /tmp/pk.pem --arg ce "$GCS_CLIENT_EMAIL" --arg pid "$GCS_PROJECT_ID" \
              '{type:$t, private_key:$pe, client_email:$ce, project_id:$pid, token_uri:"https://oauth2.googleapis.com/token"}' > /tmp/sa.json
            if ! command -v gcloud >/dev/null; then
              curl -sSL https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-502.0.0-linux-x86_64.tar.gz -o /tmp/gc.tgz
              tar -xzf /tmp/gc.tgz -C /tmp
              export PATH=/tmp/google-cloud-sdk/bin:$PATH
            fi
            gcloud auth activate-service-account --key-file=/tmp/sa.json 2>&1 | tail -15 || true
            echo "--- project access ---"
            gcloud projects describe "$GCS_PROJECT_ID" --format='value(projectId,name)' 2>&1 | tail -3 || true
            echo "--- list perms check (europe-west2 raw error) ---"
            gcloud run services list --region europe-west2 --project "$GCS_PROJECT_ID" 2>&1 | head -6
            echo "--- describe raw error (europe-west2) ---"
            gcloud run services describe computesdk-sandbox --region europe-west2 --project "$GCS_PROJECT_ID" 2>&1 | head -6
          fi

          true
      - name: Run Sandbox Volumes benchmark
        if: env.SHOULD_RUN == 'true' && github.event.inputs.trigger_source != 'cloud-run-egress-probe'
        id: run-bench
        env:
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
          PROVIDER: ${{ matrix.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          ITERATIONS: ${{ github.event.inputs.iterations || '4' }}
          BENCHMARKS_PLATFORM_API_KEY: ${{ secrets.BENCHMARKS_PLATFORM_API_KEY }}
          BENCHMARKS_PLATFORM_URL: ${{ secrets.BENCHMARKS_PLATFORM_URL }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          BENCH_TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || '' }}
          BENCH_TRIGGER_REQUESTED_BY: ${{ github.event.inputs.trigger_requested_by || '' }}
          BENCH_TRIGGER_REQUEST_ID: ${{ github.event.inputs.trigger_request_id || '' }}
        run: |
          COMMON_KEYS='BENCHMARKS_PLATFORM_API_KEY'
          case "$PROVIDER" in
            agent37) PROVIDER_KEYS='AGENT37_API_KEY' ;;
            archil) PROVIDER_KEYS='ARCHIL_API_KEY|ARCHIL_REGION|ARCHIL_DISK_ID_FILESYSTEM' ;;
            arker) PROVIDER_KEYS='ARKER_API_KEY' ;;
            beam) PROVIDER_KEYS='BEAM_TOKEN|BEAM_WORKSPACE_ID' ;;
            blaxel) PROVIDER_KEYS='BL_API_KEY|BL_WORKSPACE' ;;
            boat) PROVIDER_KEYS='BOAT_API_KEY' ;;
            briq) PROVIDER_KEYS='BRIQ_API_KEY' ;;
            buddy) PROVIDER_KEYS='BUDDY_TOKEN|BUDDY_WORKSPACE|BUDDY_PROJECT' ;;
            cloud-run) PROVIDER_KEYS='CLOUD_RUN_SANDBOX_URL|CLOUD_RUN_SANDBOX_SECRET' ;;
            cloudflare) PROVIDER_KEYS='CLOUDFLARE_SANDBOX_URL|SANDBOX_API_KEY' ;;
            codesandbox) PROVIDER_KEYS='CSB_API_KEY' ;;
            # createos volumes are registered S3 buckets — the provider reads
            # CREATEOS_S3_* env. Reuses the storage lanes' S3-compatible Tigris
            # creds when dedicated CREATEOS_S3_* vault entries don't exist.
            createos) PROVIDER_KEYS='CREATEOS_SANDBOX_API_KEY|CREATEOS_S3_BUCKET|CREATEOS_S3_ENDPOINT|CREATEOS_S3_ACCESS_KEY|CREATEOS_S3_SECRET_KEY|CREATEOS_S3_REGION|CREATEOS_S3_PATH_STYLE|TIGRIS_STORAGE_ACCESS_KEY_ID|TIGRIS_STORAGE_SECRET_ACCESS_KEY|TIGRIS_STORAGE_BUCKET|TIGRIS_STORAGE_ENDPOINT' ;;
            daytona) PROVIDER_KEYS='DAYTONA_API_KEY' ;;
            e2b) PROVIDER_KEYS='E2B_API_KEY' ;;
            freestyle) PROVIDER_KEYS='FREESTYLE_API_KEY' ;;
            sfcompute) PROVIDER_KEYS='GMN_TOKEN|GMN_API_HOST' ;;
            gravixlayer) PROVIDER_KEYS='GRAVIXLAYER_API_KEY' ;;
            hopx) PROVIDER_KEYS='HOPX_API_KEY' ;;
            isorun) PROVIDER_KEYS='ISORUN_API_KEY' ;;
            kosa8) PROVIDER_KEYS='KOSA8_API_KEY' ;;
            lelantos) PROVIDER_KEYS='LELANTOS_API_KEY|LELANTOS_DOMAIN' ;;
            modal) PROVIDER_KEYS='MODAL_TOKEN_ID|MODAL_TOKEN_SECRET' ;;
            microsandbox) PROVIDER_KEYS='MSB_API_KEY' ;;
            miosa) PROVIDER_KEYS='MIOSA_API_KEY' ;;
            mosaic) PROVIDER_KEYS='MOSAIC_API_URL|MOSAIC_API_TOKEN' ;;
            namespace) PROVIDER_KEYS='NSC_TOKEN' ;;
            neevcloud) PROVIDER_KEYS='NEEVCLOUD_API_KEY' ;;
            northflank) PROVIDER_KEYS='NORTHFLANK_TOKEN|NORTHFLANK_PROJECT_ID' ;;
            novita) PROVIDER_KEYS='NOVITA_API_KEY' ;;
            promigence) PROVIDER_KEYS='PROMIGENCE_API_KEY' ;;
            run-cloud) PROVIDER_KEYS='RUN_CLOUD_API_KEY' ;;
            sandbox0) PROVIDER_KEYS='SANDBOX0_TOKEN' ;;
            sail) PROVIDER_KEYS='SAIL_API_KEY' ;;
            sprites) PROVIDER_KEYS='SPRITES_TOKEN' ;;
            styne) PROVIDER_KEYS='STYNE_API_KEY' ;;
            superserve) PROVIDER_KEYS='SUPERSERVE_API_KEY' ;;
            luxor) PROVIDER_KEYS='TENKI_API_KEY' ;;
            tensorlake) PROVIDER_KEYS='TENSORLAKE_API_KEY' ;;
            uno) PROVIDER_KEYS='UNO_API_KEY' ;;
            upstash) PROVIDER_KEYS='UPSTASH_BOX_API_KEY' ;;
            vercel) PROVIDER_KEYS='VERCEL_TOKEN|VERCEL_TEAM_ID|VERCEL_PROJECT_ID' ;;
            *) PROVIDER_KEYS='' ;;
          esac
          if [ -n "$PROVIDER_KEYS" ]; then
            KEYS="^(${COMMON_KEYS}|${PROVIDER_KEYS})="
          else
            KEYS="^(${COMMON_KEYS})="
          fi
          . ./benchmarks/stealth/scripts/load-vault-secrets.sh "$KEYS"
          if [ -n "${ARCHIL_DISK_ID_FILESYSTEM:-}" ]; then export ARCHIL_DISK_ID="$ARCHIL_DISK_ID_FILESYSTEM"; fi

          # createos: dedicated CREATEOS_S3_* vault entries win; otherwise map
          # the storage lanes' Tigris (S3-compatible) creds onto them.
          if [ "$PROVIDER" == "createos" ] && [ -z "${CREATEOS_S3_BUCKET:-}" ]; then
            export CREATEOS_S3_BUCKET="${TIGRIS_STORAGE_BUCKET:-}"
            # Tigris defaults to t3.storage.dev — the vault may carry no
            # endpoint entry, but createos requires one.
            export CREATEOS_S3_ENDPOINT="${TIGRIS_STORAGE_ENDPOINT:-https://t3.storage.dev}"
            export CREATEOS_S3_ACCESS_KEY="${TIGRIS_STORAGE_ACCESS_KEY_ID:-}"
            export CREATEOS_S3_SECRET_KEY="${TIGRIS_STORAGE_SECRET_ACCESS_KEY:-}"
            export CREATEOS_S3_REGION="auto"
          fi

          set -o pipefail
          mkdir -p "$BENCH_RESULTS_DIR"
          # Empty platform env vars must not survive: @benchsdk/runner >=0.3.0
          # resolves the platform URL with ?? so an empty string overrides the
          # built-in default and the ingest URL fails to parse.
          [ -z "$BENCHMARKS_PLATFORM_URL" ] && unset BENCHMARKS_PLATFORM_URL
          [ -z "$BENCHMARKS_PLATFORM_API_KEY" ] && unset BENCHMARKS_PLATFORM_API_KEY
          # No `pnpm bench:stealth --` separator: @benchsdk/runner >=0.3.0 validates
          # flags strictly and rejects a bare `--` in argv.
          ARGS=(--provider "$PROVIDER" --iterations "$ITERATIONS" --run-key "$RUN_KEY")
          if [ "${DRY_RUN}" == "true" ]; then
            ARGS+=(--no-ingest)
          fi
          echo "Running: pnpm bench:stealth benchmarks/stealth/sandbox/volumes.bench.ts ${ARGS[*]}"
          pnpm bench:stealth benchmarks/stealth/sandbox/volumes.bench.ts "${ARGS[@]}" | tee "$BENCH_RESULTS_DIR/run.log"
