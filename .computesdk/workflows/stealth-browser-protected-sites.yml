name: Stealth — Browser Protected Sites

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Comma-separated provider filter. Leave empty for all providers.'
        required: false
        default: ''
        type: string
      sites:
        description: 'Comma-separated site slugs (nowsecure,indeed,leboncoin,zillow,recaptcha-demo,turnstile-demo)'
        required: false
        default: ''
        type: string
      smoke:
        description: 'Smoke test: only nowsecure + turnstile-demo, 1 iteration per site'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Skip ingestion into benchmarks-platform'
        required: true
        default: true
        type: boolean
      benchmark_slug:
        description: 'Benchmark slug for platform ingestion'
        required: true
        default: 'browser-protected-sites'
        type: string
      benchmark_name:
        description: 'Benchmark name for platform ingestion'
        required: true
        default: 'Browser Protected Sites'
        type: string
      trigger_source:
        description: 'Recorded on platform runs as their trigger (e.g. platform-retrigger); leave empty for a plain manual run'
        required: false
        default: ''
        type: string
      trigger_requested_by:
        description: 'Who asked for this run (e.g. the platform org slug); recorded alongside trigger_source'
        required: false
        default: ''
        type: string
      trigger_request_id:
        description: 'Platform re-trigger request id; recorded so the platform can link this run back to the request'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: browser-protected-sites-${{ github.ref }}
  cancel-in-progress: false

env:
  BENCHMARK_NAME: ${{ github.event.inputs.benchmark_name || (github.event_name == 'schedule' && 'Browser Protected Sites - Stealth') || 'Browser Protected Sites' }}
  BENCHMARK_SLUG: ${{ github.event.inputs.benchmark_slug || (github.event_name == 'schedule' && 'browser-protected-sites-stealth') || 'browser-protected-sites' }}

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || vars.STEALTH_BENCHMARKS_ENABLED == 'true'
    name: bench-${{ matrix.provider }}
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe;permissions.additional_grant=vault/object:*:reveal
    # 6 sites x 2 iterations x up to ~3min per visit (challenge waits),
    # serialized per provider on slower stealth stacks.
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      SHOULD_RUN: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.provider == '' || contains(format(',{0},', github.event.inputs.provider), format(',{0},', matrix.provider)) }}
    strategy:
      fail-fast: false
      matrix:
        provider:
          - browserbase
          - browseruse
          - hyperbrowser
          - kernel
          - notte
          - steel
          - tilion
    steps:
      - uses: actions/checkout@v4
        if: env.SHOULD_RUN == 'true'
      # ComputeSDK runners get no GitHub OIDC token, so nscloud-setup's
      # `nsc auth exchange-github-token` cannot work there. Pre-seed the
      # workload token file it checks for when NSC_TOKEN is available;
      # accepts either the raw bearer token or a full token JSON document.
      # It also exports NSC_DOCKER_LOGIN/NSC_CONTAINER_REGISTRY so
      # nscloud-setup skips `nsc docker login`, which this token is not
      # granted for — the benchmarks only need vault access.
      - name: Seed Namespace token file
        if: env.SHOULD_RUN == 'true'
        env:
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
        run: |
          if [ -n "${NSC_TOKEN:-}" ] && [ ! -f /var/run/nsc/token.json ]; then
            mkdir -p /var/run/nsc
            case "$NSC_TOKEN" in
              \{*) printf '%s\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
              *) printf '{"bearer_token":"%s"}\n' "$NSC_TOKEN" > /var/run/nsc/token.json ;;
            esac
            chmod 600 /var/run/nsc/token.json
            # The seeded token has no container-registry grant; tell
            # nscloud-setup to skip `nsc docker login` for later steps.
            echo "NSC_DOCKER_LOGIN=1" >> "$GITHUB_ENV"
            echo "NSC_CONTAINER_REGISTRY=nscr.io" >> "$GITHUB_ENV"
          fi
      - uses: namespacelabs/nscloud-setup@v0
        if: env.SHOULD_RUN == 'true'
      - uses: pnpm/action-setup@v4
        if: env.SHOULD_RUN == 'true'
      - uses: actions/setup-node@v4
        if: env.SHOULD_RUN == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        if: env.SHOULD_RUN == 'true'
        run: pnpm install
      - name: Build workspace packages
        if: env.SHOULD_RUN == 'true'
        run: pnpm -r --filter './packages/**' run build
      - name: Run Browser Protected Sites benchmark
        if: env.SHOULD_RUN == 'true'
        env:
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
          PROVIDER: ${{ matrix.provider }}
          SITES: ${{ github.event.inputs.smoke == 'true' && 'nowsecure,turnstile-demo' || github.event.inputs.sites }}
          ITERATIONS: ${{ github.event.inputs.smoke == 'true' && '1' || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          BENCHMARKS_PLATFORM_API_KEY: ${{ secrets.BENCHMARKS_PLATFORM_API_KEY }}
          BENCHMARKS_PLATFORM_URL: ${{ secrets.BENCHMARKS_PLATFORM_URL }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          BENCH_TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || '' }}
          BENCH_TRIGGER_REQUESTED_BY: ${{ github.event.inputs.trigger_requested_by || '' }}
          BENCH_TRIGGER_REQUEST_ID: ${{ github.event.inputs.trigger_request_id || '' }}
        run: |
          COMMON_KEYS='BENCHMARKS_PLATFORM_API_KEY'
          case "$PROVIDER" in
            browserbase) PROVIDER_KEYS='BROWSERBASE_API_KEY|BROWSERBASE_PROJECT_ID' ;;
            browseruse) PROVIDER_KEYS='BROWSER_USE_API_KEY' ;;
            hyperbrowser) PROVIDER_KEYS='HYPERBROWSER_API_KEY' ;;
            kernel) PROVIDER_KEYS='KERNEL_API_KEY' ;;
            notte) PROVIDER_KEYS='NOTTE_API_KEY' ;;
            steel) PROVIDER_KEYS='STEEL_API_KEY' ;;
            tilion) PROVIDER_KEYS='TILION_API_KEY|TILION_BASE_URL' ;;
            *) PROVIDER_KEYS='' ;;
          esac
          if [ -n "$PROVIDER_KEYS" ]; then
            KEYS="^(${COMMON_KEYS}|${PROVIDER_KEYS})="
          else
            KEYS="^(${COMMON_KEYS})="
          fi
          . ./benchmarks/stealth/scripts/load-vault-secrets.sh "$KEYS"

          set -o pipefail
          mkdir -p results
          # Empty platform env vars must not survive: @benchsdk/runner >=0.3.0
          # resolves the platform URL with ?? so an empty string overrides the
          # built-in default and the ingest URL fails to parse.
          [ -z "$BENCHMARKS_PLATFORM_URL" ] && unset BENCHMARKS_PLATFORM_URL
          [ -z "$BENCHMARKS_PLATFORM_API_KEY" ] && unset BENCHMARKS_PLATFORM_API_KEY
          # No `pnpm bench:stealth --` separator: @benchsdk/runner >=0.3.0 validates
          # flags strictly and rejects a bare `--` in argv.
          ARGS=(--provider "$PROVIDER" --run-key "$RUN_KEY")
          if [ -n "${SITES}" ]; then
            ARGS+=(--sites "$SITES")
          fi
          if [ -n "${ITERATIONS}" ]; then
            ARGS+=(--iterations "$ITERATIONS")
          fi
          if [ "${DRY_RUN}" == "true" ]; then
            ARGS+=(--no-ingest)
          fi
          echo "Running: pnpm bench:stealth benchmarks/stealth/browser/protected-sites.bench.ts ${ARGS[*]}"
          pnpm bench:stealth benchmarks/stealth/browser/protected-sites.bench.ts "${ARGS[@]}"
