  <text class="timestamp" x="1256" y="532" text-anchor="end">Last updated: Aug 18, 2026, 04:30 PM UTC</text>
  <text class="timestamp" x="24" y="546">Each round creates 50 sessions in parallel, holds all alive (barrier), runs 10 actions on each simultaneously, then releases all. Lower latency is better.</text>
